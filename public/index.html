<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>books</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>books</h1>
    <div id="auth-area"></div>
  </header>

  <form id="add-form" class="add-form" hidden>
    <input id="add-title" type="text" placeholder="title" maxlength="200" required />
    <input id="add-author" type="text" placeholder="author (optional)" maxlength="200" />
    <select id="add-location">
      <option value="home">home</option>
      <option value="school">school</option>
    </select>
    <button type="submit">add</button>
  </form>

  <main class="columns">
    <section class="column">
      <h2>school</h2>
      <ul id="list-school" class="book-list"></ul>
    </section>
    <section class="column">
      <h2>home</h2>
      <ul id="list-home" class="book-list"></ul>
    </section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
